name: GolfDash
options:
  bundleIdPrefix: com.danfinkel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TrackManKit:
    path: Packages/TrackManKit

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  GolfDash:
    type: application
    platform: iOS
    sources:
      - GolfDash
    dependencies:
      - package: TrackManKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfinkel.golfdash
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golf Dash
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your Personal Team in Xcode (Signing & Capabilities); free
        # signing works, installs just expire after 7 days.
        DEVELOPMENT_TEAM: ""

